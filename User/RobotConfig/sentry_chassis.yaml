modules:
  - id: buzzer # 蜂鸣器告警模块实例
    module: pldx/BuzzerAlarm
    args:
      - pwm: pwm_tim4_ch3
      - alarm_freq: 1500
      - alarm_duration: 300
      - alarm_delay: 300
  - id: ref # 裁判系统串口模块实例
    module: pldx/Referee
    args:
      - uart: usart1
      - cmd: nullptr
      - task_stack_depth_uart: 1536
      - baudrate: 115200
      - referee_chassis_tp_name: '"chassis_ref"'
      - referee_launcher_tp_name: '"launcher_ref"'
      - referee_robot_game_tp_name: '"sentry_ref"'
      - referee_radar_tp_name: '"radar_ref"'
      - thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - id: SentryProtocol_0 # 哨兵比赛协议处理模块实例
    module: pldx/SentryProtocol
    args:
      - referee: ref
      - referee_sentry_tp_name: '"sentry_ref"'
      - buy_bullet_topic_name: '"sentry_buy_bullet_num"'
      - remote_buy_bullet_times_topic_name: '"sentry_remote_buy_bullet_times"'
      - remote_buy_hp_times_topic_name: '"sentry_remote_buy_hp_times"'
      - buy_resurrection_topic_name: '"sentry_buy_resurrection"'
      - state_topic_name: '"sentry_state"'
  - id: cmd # 控制指令分发模块实例
    module: pldx/CMD
    args:
      - mode: CMD::Mode::CMD_OP_CTRL
      - chassis_cmd_topic_name: '"chassis_cmd"'
      - gimbal_cmd_topic_name: '"gimbal_cmd"'
      - launcher_cmd_topic_name: '"launcher_cmd"'
      - dispatch_task_stack_depth: 1024
      - dispatch_thread_priority: LibXR::Thread::Priority::HIGH
  - id: super_power # 超级电容模块实例
    module: pldx/SuperPower
    args:
      - can: can2
  - id: power_control # 底盘功率控制模块实例
    module: pldx/PowerControl
    args:
      - superpower: super_power
      - chassis_static_power_loss: 2.78
      - reduction_ratio_3508: 19.0
      - motor_count_3508: 4
      - motor_count_6020: 0
  - id: motor_wheel_0 # 0 号驱动轮电机；编号须与底盘运动学的轮位一致
    module: pldx/RMMotor
    args:
      - can: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508 # 电机型号
          reverse: true # true 时反转控制与反馈方向
          feedback_id: 513 # 电机 CAN 反馈 ID（0x204）
  - id: motor_wheel_1 # 1 号驱动轮电机
    module: pldx/RMMotor
    args:
      - can: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508 # 电机型号
          reverse: true # true 时反转控制与反馈方向
          feedback_id: 514 # 电机 CAN 反馈 ID（0x201）
  - id: motor_wheel_2 # 2 号驱动轮电机
    module: pldx/RMMotor
    args:
      - can: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508 # 电机型号
          reverse: true # 该轮安装方向与正方向相反
          feedback_id: 515 # 电机 CAN 反馈 ID（0x202）
  - id: motor_wheel_3 # 3 号驱动轮电机
    module: pldx/RMMotor
    args:
      - can: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508 # 电机型号
          reverse: true # true 时反转控制与反馈方向
          feedback_id: 516 # 电机 CAN 反馈 ID（0x203）
  - id: motor_steer_0 # 0 号舵向电机
    module: pldx/RMMotor
    args:
      - can: can2
      - param:
          model: RMMotor::Model::MOTOR_NONE # 未限定型号，按 CAN 反馈通用模式驱动
          reverse: false # true 时反转控制与反馈方向
          feedback_id: 520 # 电机 CAN 反馈 ID（0x208）
  - id: motor_steer_1 # 1 号舵向电机
    module: pldx/RMMotor
    args:
      - can: can2
      - param:
          model: RMMotor::Model::MOTOR_NONE # 未限定型号，按 CAN 反馈通用模式驱动
          reverse: false # true 时反转控制与反馈方向
          feedback_id: 517 # 电机 CAN 反馈 ID（0x205）
  - id: motor_steer_2 # 2 号舵向电机
    module: pldx/RMMotor
    args:
      - can: can2
      - param:
          model: RMMotor::Model::MOTOR_NONE # 未限定型号，按 CAN 反馈通用模式驱动
          reverse: false # true 时反转控制与反馈方向
          feedback_id: 518 # 电机 CAN 反馈 ID（0x206）
  - id: motor_steer_3 # 3 号舵向电机
    module: pldx/RMMotor
    args:
      - can: can2
      - param:
          model: RMMotor::Model::MOTOR_NONE # 未限定型号，按 CAN 反馈通用模式驱动
          reverse: false # true 时反转控制与反馈方向
          feedback_id: 519 # 电机 CAN 反馈 ID（0x207）
  - id: chassis # 四舵轮底盘控制模块实例
    template_args:
      - Omni
    module: pldx/Chassis
    args:
      - motor_wheel_0: motor_wheel_0
      - motor_wheel_1: motor_wheel_1
      - motor_wheel_2: motor_wheel_2
      - motor_wheel_3: motor_wheel_3
      - motor_steer_0: motor_steer_0
      - motor_steer_1: motor_steer_1
      - motor_steer_2: motor_steer_2
      - motor_steer_3: motor_steer_3
      - cmd: cmd
      - power_control: power_control
      - referee: ref
      - task_stack_depth: 2048
      - chassis_param:
          wheel_radius: 0.075 # 车轮半径，单位 m
          wheel_to_center: 0.245 # 车轮转向轴到车体中心距离，单位 m
          gravity_height: 0.0 # 重心相对地面的高度，单位 m；未建模时为 0
          reduction_ratio: 19 # 驱动轮减速比（电机转速/车轮转速）
          wheel_resistance: 0.0 # 轮地阻力补偿系数；未启用时为 0
          error_compensation: 0.0 # 运动学误差补偿系数；未启用时为 0
          gravity: 0.0 # 整车重力，单位 N
          length: 0.347 # 车体长度，单位 m；当前模型未使用
          width: 0.347 # 车体宽度，单位 m；当前模型未使用
          rotor_speed_scale: 0.95 # 小陀螺模式速度缩放上限
          rotor_omega_min_scale: 0.55 # 小陀螺模式低角速度时的最小缩放比例
          rotor_buffer_low_j: 35.0 # 小陀螺降速开始的底盘功率缓冲能量阈值，单位 J
          rotor_buffer_high_j: 70.0 # 小陀螺恢复全速的底盘功率缓冲能量阈值，单位 J
          rotor_scale_lpf_alpha: 0.2 # 小陀螺速度缩放低通滤波系数，范围 [0, 1]
          spin_torque_amp_nm: 15.0 # 变速小陀螺 DRIVE 相底盘偏航扭矩幅值，单位 N·m
          spin_omega_hi_rad_s: 14.0 # 变速小陀螺滞环上限，进入滑行相，单位 rad/s
          spin_omega_lo_rad_s: 6.0 # 变速小陀螺滞环下限，恢复驱动相，单位 rad/s
          spin_omega_max_rad_s: 16.0 # 变速小陀螺硬安全上限，超限强制滑行，单位 rad/s
          spin_drive_timeout_s: 2.0 # 变速小陀螺单次驱动相最长时间，单位 s
    # PID 通用项：k 为总缩放系数；p/i/d 为三项增益；i_limit、out_limit 为 0 时通常表示不限制；cycle 表示误差按角度周期回绕。
      - pid_follow_:
          k: 1.0 # 跟随环总缩放系数
          p: 2.5 # 跟随环比例增益
          i: 0.0 # 跟随环积分增益
          d: 0.0 # 跟随环微分增益
          i_limit: 0.0 # 跟随环积分限幅
          out_limit: 0.0 # 跟随环输出限幅
          cycle: true # 跟随角度误差使用周期回绕
      - pid_velocity_x_: # 车体 X 向速度闭环
          k: 1.0
          p: 14.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_velocity_y_: # 车体 Y 向速度闭环
          k: 1.0
          p: 14.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_omega_: # 车体偏航角速度闭环
          k: 1.0
          p: 30.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_wheel_speed_0_: # 0 号驱动轮速度闭环
          k: 1.0
          p: 1.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_wheel_speed_1_: # 1 号驱动轮速度闭环
          k: 1.0
          p: 1.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_wheel_speed_2_: # 2 号驱动轮速度闭环
          k: 1.0
          p: 1.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_wheel_speed_3_: # 3 号驱动轮速度闭环
          k: 1.0
          p: 1.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_steer_angle_0_: # 0 号舵向角度闭环
          k: 1.0
          p: 50.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: true
      - pid_steer_angle_1_: # 1 号舵向角度闭环
          k: 1.0
          p: 50.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: true
      - pid_steer_angle_2_: # 2 号舵向角度闭环
          k: 1.0
          p: 50.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: true
      - pid_steer_angle_3_: # 3 号舵向角度闭环
          k: 1.0
          p: 50.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: true
      - pid_steer_speed_0_: # 0 号舵向电机速度闭环
          k: 1.0
          p: 0.15
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_steer_speed_1_: # 1 号舵向电机速度闭环
          k: 1.0
          p: 0.15
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_steer_speed_2_: # 2 号舵向电机速度闭环
          k: 1.0
          p: 0.15
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_steer_speed_3_: # 3 号舵向电机速度闭环
          k: 1.0
          p: 0.15
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - thread_priority: LibXR::Thread::Priority::HIGH
  - id: BMI088_0 # 底盘 IMU 模块实例
    module: pldx/BMI088
    args:
      - accl_cs: ACCL_CS
      - gyro_cs: GYRO_CS
      - gyro_int: GYRO_INT
      - spi: spi1
      - heater_pwm: pwm_tim10_ch1
      - database: database
      - ramfs: ramfs
      - freq: BMI088::GyroFreq::GYRO_1000HZ_BW116HZ
      - accl_freq: BMI088::AcclFreq::ACCL_800HZ
      - gyro_range: BMI088::GyroRange::DEG_2000DPS
      - accl_range: BMI088::AcclRange::ACCL_24G
      - rotation: LibXR::Quaternion<float>{1.0, 0.0, 0.0, 0.0}
      - pid_param:
          k: 1.0
          p: 0.35
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - gyro_topic_name: '"chassis_gyro"'
      - accl_topic_name: '"chassis_accl"'
      - target_temperature: 45
      - task_stack_depth: 1536
  - id: chassis_ahrs # 底盘板 AHRS 姿态解算
    module: pldx/MadgwickAHRS
    args:
      - ramfs: ramfs
      - beta: 0.05
      - gyro_topic_name: '"chassis_gyro"'
      - accl_topic_name: '"chassis_accl"'
      - quaternion_topic_name: '"chassis_ahrs_quaternion"'
      - euler_topic_name: '"chassis_euler"'
      - task_stack_depth: 2048
  - id: dual_board # 底盘与云台控制板 CAN 通信模块实例
    template_args:
      - DualBoardRole::CHASSIS
      - Omni
    module: pldx/DualBoard
    args:
      - can: can2
      - cmd: nullptr
      - power_control: power_control
      - tx_id: 0x311
      - rx_id: 0x312
      - rx_buffer_size: 256
      - offline_timeout_ms: 100
      - chassis: chassis
      - mode_topic_name: '"dualboard_chassis_mode"'
      - sentry_buy_bullet_num_topic_name: '"sentry_buy_bullet_num"'
      - sentry_remote_buy_bullet_times_topic_name: '"sentry_remote_buy_bullet_times"'
      - sentry_remote_buy_hp_times_topic_name: '"sentry_remote_buy_hp_times"'
      - sentry_buy_resurrection_topic_name: '"sentry_buy_resurrection"'
      - sentry_state_topic_name: '"sentry_state"'
      - chassis_euler_topic_name: '"chassis_euler"'
settings:
  monitor_sleep_ms: 1000 # 模块监控任务的轮询周期，单位 ms

modules:
  - id: buzzer # 蜂鸣器告警模块
    module: pldx/BuzzerAlarm
    args:
      - pwm: pwm_tim4_ch3
      - alarm_freq: 1500
      - alarm_duration: 300
      - alarm_delay: 300
  - id: BMI088_0 # 云台 IMU 模块
    module: pldx/BMI088
    args:
      - accl_cs: ACCL_CS
      - gyro_cs: GYRO_CS
      - gyro_int: GYRO_INT
      - spi: spi1
      - heater_pwm: pwm_tim10_ch1
      - database: database
      - ramfs: ramfs
      - freq: BMI088::GyroFreq::GYRO_1000HZ_BW116HZ
      - accl_freq: BMI088::AcclFreq::ACCL_800HZ
      - gyro_range: BMI088::GyroRange::DEG_2000DPS
      - accl_range: BMI088::AcclRange::ACCL_24G
      - rotation: LibXR::Quaternion<float>{0.70710678, 0.0, 0.0, -0.70710678}
      - pid_param:
          k: 1.0
          p: 0.35
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - gyro_topic_name: '"gimbal_gyro"'
      - accl_topic_name: '"gimbal_accl"'
      - target_temperature: 45
      - task_stack_depth: 3072
  - id: ahrs # Madgwick 姿态解算模块
    module: pldx/MadgwickAHRS
    args:
      - ramfs: ramfs
      - beta: 0.05
      - gyro_topic_name: '"gimbal_gyro"'
      - accl_topic_name: '"gimbal_accl"'
      - quaternion_topic_name: '"ahrs_quaternion"'
      - euler_topic_name: '"gimbal_euler"'
      - task_stack_depth: 2048
  - id: ref # 裁判系统数据解析模块
    module: pldx/Referee
    args:
      - uart: usart1
      - cmd: nullptr
      - task_stack_depth_uart: 1536
      - baudrate: 115200
      - referee_chassis_tp_name: '"chassis_ref"'
      - referee_launcher_tp_name: '"launcher_ref"'
      - referee_robot_game_tp_name: '"sentry_ref"'
      - referee_radar_tp_name: '"radar_ref"'
      - thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - id: cmd # 控制指令分发模块
    module: pldx/CMD
    args:
      - mode: CMD::Mode::CMD_OP_CTRL
      - chassis_cmd_topic_name: '"chassis_cmd"'
      - gimbal_cmd_topic_name: '"gimbal_cmd"'
      - launcher_cmd_topic_name: '"launcher_cmd"'
      - dispatch_task_stack_depth: 1024
      - dispatch_thread_priority: LibXR::Thread::Priority::HIGH
  - id: dr16 # DR16 遥控器接收模块
    module: pldx/DR16
    args:
      - uart: usart3
      - cmd: cmd
      - task_stack_depth_uart: 1536
      - thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - id: motor_yaw # 云台 yaw 轴 GM6020 电机
    module: pldx/RMMotor
    args:
      - can: can2
      - param:
          model: RMMotor::Model::MOTOR_GM6020 # 电机型号
          reverse: false # true 时反转控制与反馈方向
          feedback_id: 0x209 # 电机 CAN 反馈 ID
  - id: motor_pit # 云台 pitch 轴达妙 DM4310 电机
    module: pldx/RMMotor
    args:
      - can: can2
      - param:
          model: RMMotor::Model::MOTOR_GM6020 # 电机型号
          reverse: false # true 时反转控制与反馈方向
          feedback_id: 0x205
  - id: gimbal # 云台控制模块
    module: pldx/Gimbal
    args:
      - cmd: cmd
      - motor_pit: motor_pit
      - motor_yaw: motor_yaw
      - task_stack_depth: 3072
      - pid_yaw_angle: # yaw 角度外环
          k: 1.0
          p: 1.0
          i: 0.0
          d: 0.0
          i_limit: 0.015
          out_limit: 0.0
          cycle: true
      - pid_yaw_omega: # yaw 角速度内环
          k: 1.0
          p: 1.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 2.223
          cycle: false
      - pid_pit_angle: # pitch 角度外环
          k: 1.0
          p: 1.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0
          cycle: true
      - pid_pit_omega: # pitch 角速度内环
          k: 1.0
          p: 1.0
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 10.0
          cycle: false
      - gimbal_param:
          pit_max_angle: 0.0
          pit_min_angle: 0.0
          pit_lc: 0.0
          pit_theta: 0.0
          yaw_k: 0.0
          j_pit: 0.0
          j_yaw: 0.0
          pit_zero: 0.0
          yaw_zero: 0.0
          patrol_pitch_amplitude_rad: 0.0
          patrol_pitch_angular_rate_rad_s: 0.0
          patrol_yaw_rate_rad_s: 0.0
          reverse_flag: false
          thread_priority: LibXR::Thread::Priority::MEDIUM
          rotor_ff_enabled: false
          yaw_manual_controller: YawManualController::PID
          yaw_ai_controller: YawAiController::LQR_ESO
      - yaw_lqr_eso:
          k_theta: 5.000000 # LQR 角度误差反馈增益
          k_omega: 0.479093 # LQR 角速度误差反馈增益
          k_i: 0.750000 # LQI 角度误差积分增益
          theta_integral_limit_rad_s: 0.5 # 角度积分状态限幅，单位 rad*s
          tau_coulomb_nm: 0.05 # 库仑摩擦补偿力矩，单位 N*m
          coulomb_smooth_rad_s: 0.2 # 库仑摩擦符号函数平滑速度，单位 rad/s
          eso_bandwidth_rad_s: 44.986 # 扩张状态观测器带宽，单位 rad/s
          eso_comp_gain: 1.0 # ESO 扰动补偿增益
          eso_comp_limit_nm: 0.3 # ESO 扰动补偿力矩限幅，单位 N*m
          eso_omega_gate_rad_s: 5.0 # 高于此角速度时禁止/抑制 ESO 补偿，单位 rad/s
          eso_alpha_gate_rad_s2: 50.0 # 高于此角加速度时禁止/抑制 ESO 补偿，单位 rad/s^2
          tau_bias_ki: 0.5 # 恒定力矩偏置估计积分增益
          tau_bias_limit_nm: 0.15 # 恒定力矩偏置估计限幅，单位 N*m
          tau_meas_lpf_alpha: 0.1 # 力矩测量低通滤波系数，范围 [0, 1]
          theta_deadband_rad: 0.0 # 角度误差死区，单位 rad
          torque_soft_limit_nm: 2.0 # 力矩软限幅，单位 N*m
          torque_slew_rate_nm_s: 1000.0 # 力矩变化率限幅，单位 N*m/s
          eso_enable: true # 启用 ESO 状态估计
          eso_comp_enable: false # 启用 ESO 扰动补偿输出
          coulomb_enable: false # 启用库仑摩擦补偿
          lqi_enable: false # 启用含积分项的 LQI 控制
          torque_bias_enable: false # 启用恒定力矩偏置补偿
          torque_slew_enable: true # 启用力矩变化率限制
    # yaw 滑模力矩控制参数；c/K/epsilon 为上电初值，实车需重调。
      - yaw_smc:
          c: 16.572139 # 滑模面系数，单位 1/s
          k: 7.632443 # 线性趋近项系数，单位 1/s
          epsilon: 6.575385 # 切换项系数，单位 rad/s^2
          q: 21.0 # 终端滑模指数分子
          p: 27.0 # 终端滑模指数分母，须大于 q
          error_deadband_rad: 0.0 # 角度误差死区，单位 rad
          ftsmc_switch_rad: 0.25 # 小于该误差时切回线性滑模，单位 rad
          sat_boundary: 0.058067 # sat(s/boundary) 边界层厚度
          torque_soft_limit_nm: 2.0 # 力矩软限幅，单位 N*m
          torque_min_nm: -2.2230 # 力矩硬限幅下限，单位 N*m
          torque_max_nm: 2.2230 # 力矩硬限幅上限，单位 N*m
          torque_slew_rate_nm_s: 1000.0 # 力矩变化率限幅，单位 N*m/s
          ftsmc_enable: true # 启用快速终端滑模；关闭则全程线性滑模
          torque_slew_enable: true # 启用力矩变化率限制
    # 系统辨识（一次性标定工具）：enabled=true 时上电自动进入辨识流程，
    # 完成后锁死 RELAX，结果经 Ozone 读取后须改回 false 重启恢复正常使用。
    # 操作规程：右拨杆置上段（RELAX 档）、先开遥控器再上云台板电——
    # 拨杆在中/下段上电会导致辨识不进入；ARMING 倒计时期间拨到中/下段
    # 或激励期间任何拨杆动作都会中止辨识（上段 RELAX 事件除外）。
      - system_identify:
          enabled: false # 总开关：true 上电进入辨识（等待 RC 上线后倒计时启动）
          axis_select: IdentifyAxis::PITCH_ONLY # 辨识轴：YAW_ONLY / PITCH_ONLY / BOTH（yaw 先）
          arming_delay_s: 3.0 # RC 上线后启动倒计时，单位 s
          step_torque_yaw_nm: 0.5 # yaw 开环力矩阶跃幅值，单位 N*m（GM6020 上限 2.223）
          step_torque_pit_nm: 0.2 # pitch 开环力矩阶跃幅值，单位 N*m（首测建议 0.15 起步）
          step_half_period_s: 0.5 # 阶跃半周期（+tau/-tau 各持续时间），单位 s
          step_cycles: 10 # 每轴双向换向周期数
          settle_time_s: 1.0 # 激励后静置收敛时间，单位 s
          lpf_cutoff_hz: 50.0 # tau/omega/alpha 统一一阶低通截止频率，单位 Hz
          alpha_gate_rad_s2: 1.0 # RLS 更新门控：|alpha| 低于此值冻结，单位 rad/s^2
          rls_delta: 1000.0 # RLS 协方差初值 P0 = delta*I
          rls_lambda: 1.0 # RLS 遗忘因子（一次性标定取 1.0）
          coulomb_tanh_scale: 0.1 # 库仑摩擦 tanh 平滑速度尺度，单位 rad/s
          omega_abort_yaw: 8.0 # yaw 超速中止阈值，单位 rad/s
          omega_abort_pit: 4.0 # pitch 超速中止阈值，单位 rad/s
          pit_angle_margin_rad: 0.1 # pitch 机械限位内缩安全边距，单位 rad
          axis_timeout_s: 30.0 # 单轴激励总时长超时中止，单位 s
  - id: dual_board # 云台与底盘控制板 CAN 通信模块
    template_args:
      - DualBoardRole::GIMBAL
      - Omni
    module: pldx/DualBoard
    args:
      - can: can2
      - cmd: cmd
      - power_control: nullptr
      - tx_id: 0x312
      - rx_id: 0x311
      - rx_buffer_size: 256
      - offline_timeout_ms: 100
      - chassis: nullptr
      - mode_topic_name: '"dualboard_chassis_mode"'
      - sentry_buy_bullet_num_topic_name: '"sentry_buy_bullet_num"'
      - sentry_remote_buy_bullet_times_topic_name: '"sentry_remote_buy_bullet_times"'
      - sentry_remote_buy_hp_times_topic_name: '"sentry_remote_buy_hp_times"'
      - sentry_buy_resurrection_topic_name: '"sentry_buy_resurrection"'
      - sentry_state_topic_name: '"sentry_state"'
      - chassis_euler_topic_name: '"chassis_euler"'
  - id: motor_trig # 拨弹盘 M2006 电机
    module: pldx/RMMotor
    args:
      - can: can1
      - param:
          model: RMMotor::Model::MOTOR_M2006 # 电机型号
          reverse: false # true 时反转控制与反馈方向
          feedback_id: 515 # 电机 CAN 反馈 ID（0x203）
  - id: motor_fric_0 # 左侧/前左摩擦轮 M3508 电机
    module: pldx/RMMotor
    args:
      - can: can2
      - param:
          model: RMMotor::Model::MOTOR_M3508 # 电机型号
          reverse: true # 对消双摩擦轮安装方向
          feedback_id: 513 # 电机 CAN 反馈 ID（0x201）
  - id: motor_fric_1 # 右侧/前右摩擦轮 M3508 电机
    module: pldx/RMMotor
    args:
      - can: can2
      - param:
          model: RMMotor::Model::MOTOR_M3508 # 电机型号
          reverse: false # true 时反转控制与反馈方向
          feedback_id: 512 # 电机 CAN 反馈 ID（0x203）
  - id: launcher # 步兵发射机构控制模块
    module: pldx/InfantryLauncher
    args:
      - motor_fric_0: motor_fric_0
      - motor_fric_1: motor_fric_1
      - motor_trig: motor_trig
      - cmd: cmd
      - referee: nullptr
      - task_stack_depth: 1536
      - pid_param_trig_angle: # 拨弹盘角度闭环
          k: 1.0
          p: 40.0
          i: 0.1
          d: 0.0
          i_limit: 0.0
          out_limit: 100.0
          cycle: false
      - pid_param_trig_speed: # 拨弹盘速度闭环
          k: 1.0
          p: 0.65
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 0.0
          cycle: false
      - pid_param_fric_speed_0: # 左摩擦轮速度闭环
          k: 1.0
          p: 0.002
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 1.0
          cycle: false
      - pid_param_fric_speed_1: # 右摩擦轮速度闭环
          k: 1.0
          p: 0.002
          i: 0.0
          d: 0.0
          i_limit: 0.0
          out_limit: 1.0
          cycle: false
      - launcher_param:
          fric1_setpoint_speed: 6000.0 # 摩擦轮 1 目标转速，单位 rpm
          target_bullet_speed: 24.0 # 目标弹速，单位 m/s
          bullet_speed_tolerance: 1.5 # 弹速允许偏差，单位 m/s
          trig_gear_ratio: 36 # 拨弹盘传动减速比
          num_trig_tooth: 8 # 拨弹盘单圈对应的拨弹齿数
          heat_control_enabled: false # 启用基于裁判剩余热量的分档弹频控制
          single_heat: 10.0 # 单发热量消耗
          max_frequency: 30.0 # 最大发射频率（全速档射频），单位 Hz
      - thread_priority: LibXR::Thread::Priority::HIGH
  - id: event_binder # 遥控器事件到各模块模式事件的绑定表
    module: pldx/EventBinder
    args:
      - modules: # 可作为事件源或目标的模块注册表
          - EventBinder::ModuleInfo{"dr16", dr16}
          - EventBinder::ModuleInfo{"cmd", cmd}
          - EventBinder::ModuleInfo{"dual_board", dual_board}
          - EventBinder::ModuleInfo{"gimbal", gimbal}
          - EventBinder::ModuleInfo{"launcher", launcher}
      - event_binding_groups: # 每组 bindings 在同一事件分发器中注册
          - EventBinder::BindingGroup{{EventBinder::EventBinding{"dr16", DR16::SwitchPos::DR16_SW_R_POS_TOP,
            "cmd", CMD::Mode::CMD_OP_CTRL}, EventBinder::EventBinding{"dr16",
            DR16::SwitchPos::DR16_SW_R_POS_MID, "cmd", CMD::Mode::CMD_OP_CTRL},
            EventBinder::EventBinding{"dr16", DR16::SwitchPos::DR16_SW_R_POS_BOT, "cmd",
            CMD::Mode::CMD_AUTO_CTRL}}}
          - EventBinder::BindingGroup{{EventBinder::EventBinding{"dr16", DR16::SwitchPos::DR16_SW_L_POS_TOP,
            "dual_board", Omni::ChassisMode::RELAX}, EventBinder::EventBinding{"dr16",
            DR16::SwitchPos::DR16_SW_L_POS_MID, "dual_board", Omni::ChassisMode::FOLLOW},
            EventBinder::EventBinding{"dr16", DR16::SwitchPos::DR16_SW_L_POS_BOT, "dual_board",
            Omni::ChassisMode::ROTOR_VARIABLE}}}
          - EventBinder::BindingGroup{{EventBinder::EventBinding{"dr16", DR16::SwitchPos::DR16_SW_R_POS_TOP,
            "gimbal", GimbalEvent::SET_MODE_RELAX}, EventBinder::EventBinding{"dr16",
            DR16::SwitchPos::DR16_SW_R_POS_MID, "gimbal", GimbalEvent::SET_MODE_COMMON},
            EventBinder::EventBinding{"dr16", DR16::SwitchPos::DR16_SW_R_POS_BOT, "gimbal",
            GimbalEvent::SET_VISION_AUTO_AIM}, EventBinder::EventBinding{"dr16", DR16::Key::KEY_Q, "gimbal",
            GimbalEvent::SET_VISION_SMALL_BUFF}, EventBinder::EventBinding{"dr16", DR16::Key::KEY_E, "gimbal",
            GimbalEvent::SET_VISION_BIG_BUFF}}}
          - EventBinder::BindingGroup{{EventBinder::EventBinding{"dr16", DR16::SwitchPos::DR16_SW_L_POS_TOP,
            "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE}, EventBinder::EventBinding{"dr16",
            DR16::SwitchPos::DR16_SW_R_POS_TOP, "launcher",
            InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE}, EventBinder::EventBinding{"dr16",
            DR16::SwitchPos::DR16_SW_R_POS_MID, "launcher",
            InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}, EventBinder::EventBinding{"dr16",
            DR16::SwitchPos::DR16_SW_R_POS_MID, "launcher",
            InfantryLauncher::LauncherEvent::SET_SHOTMODE_CONTINUE}, EventBinder::EventBinding{"dr16",
            DR16::SwitchPos::DR16_SW_R_POS_BOT, "launcher",
            InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}}}
  - id: talos_link # Talos 视觉 USB 通信模块
    module: pldx/TalosLink
    args:
      - uart: usb_otg_fs_talos_cdc
      - cmd: cmd
      - gyro_topic_name: '"gimbal_gyro"'
      - euler_topic_name: '"gimbal_euler"'
      - launcher_topic_name: '"launcher_ref"'
      - referee_topic_name: '"sentry_ref"'
      - task_stack_depth: 2048
      - thread_priority: LibXR::Thread::Priority::MEDIUM
settings:
  monitor_sleep_ms: 1000 # 模块监控轮询周期，单位 ms
